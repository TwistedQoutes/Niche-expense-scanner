name: Mobile apps

# Signed builds for TestFlight and Play. Not part of CI: a native build costs
# minutes (a macOS runner costs ten times an ubuntu one) and nothing about a
# server-side change alters the binary, which loads the deployed site rather
# than bundling it.
#
# Run it when something native changes — capacitor.config.ts, the icons, a
# permission, the offline page — or when you want a build on a tester's phone.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [both, ios, android]
        default: both
      lane:
        description: Where it goes
        type: choice
        options: [testers, store]
        default: testers
  push:
    tags:
      # v1.2.3 cuts a release of both apps.
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false # Never cancel a half-finished upload to a store.

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # The web assets and native projects are identical for both platforms, so
  # they are prepared once and handed to the two build jobs.
  # ───────────────────────────────────────────────────────────────────────────
  prepare:
    name: Sync native projects
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Work out the version
        id: version
        # A tag build takes its version from the tag; a manual one from
        # package.json, so a test build is not pretending to be a release.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Capacitor
        # Copies the offline shell and bakes capacitor.config.ts into both
        # native projects. MOBILE_SERVER_URL is read at this moment and cannot
        # be changed afterwards without syncing again.
        env:
          MOBILE_SERVER_URL: ${{ vars.MOBILE_SERVER_URL || 'https://jobflowai.dev' }}
        run: npx cap sync

      - name: Check the icons are the committed ones
        # Regenerating here would hide a brand change that was never committed,
        # and a build whose icon differs from the repository is confusing a
        # month later.
        run: |
          node scripts/generate-app-icons.mjs > /dev/null
          if ! git diff --quiet -- native/assets public/icons; then
            echo "::error::The committed icons do not match scripts/generate-app-icons.mjs."
            echo "Run: node scripts/generate-app-icons.mjs && git add -A && git commit"
            git diff --stat -- native/assets public/icons
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: native-projects
          path: |
            ios
            android
          retention-days: 1
          include-hidden-files: true

  # ───────────────────────────────────────────────────────────────────────────
  android:
    name: Android
    needs: prepare
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v5
        with:
          name: native-projects

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Write google-services.json
        # Firebase's project config. Not in the repository: it identifies the
        # project and carries scoped API keys. Base64 in a secret so no
        # newline handling can corrupt it.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON is not set. Push notifications will not work without it."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Restore the upload keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/upload-keystore.jks

      - name: Set the version
        # versionName is what a person sees; versionCode must increase on every
        # upload or Play refuses the bundle. The run number is monotonic and
        # never reused, which is exactly the property needed.
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ needs.prepare.outputs.version }}\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build the app bundle
        env:
          JOBFLOW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JOBFLOW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JOBFLOW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        # A bundle, not an APK: Play has required .aab for new apps since 2021.
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload to Play
        if: inputs.lane == 'store' || startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.jobflowai.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          # internal reaches testers in minutes. Promote to production in the
          # Play Console once someone has actually opened it.
          track: internal
          status: completed

  # ───────────────────────────────────────────────────────────────────────────
  ios:
    name: iOS
    needs: prepare
    if: inputs.platform != 'android'
    # A macOS runner is the only way to build for iOS, and it bills at ten times
    # the Linux rate — which is why this workflow is not on every push.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v5
        with:
          name: native-projects

      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO" ]; then
            echo "::error::IOS_GOOGLE_SERVICE_INFO_PLIST is not set. Push notifications will not work without it."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO" | base64 -d > ios/App/App/GoogleService-Info.plist

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Import the signing certificate and profile
        # A throwaway keychain, unlocked for this job only. The runner is
        # destroyed afterwards, but a build that leaves a certificate in the
        # login keychain is a habit worth not forming.
        env:
          CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERTIFICATE_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/jobflow.mobileprovision

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Set the version
        # CFBundleVersion must increase on every upload to App Store Connect, or
        # the upload is rejected after the build has already taken ten minutes.
        working-directory: ios/App
        run: |
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleShortVersionString ${{ needs.prepare.outputs.version }}" App/Info.plist || true
          xcrun agvtool new-version -all ${{ github.run_number }}

      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROFILE_NAME }}" \
            archive

      - name: Export the ipa
        working-directory: ios/App
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.jobflowai.app</key>
              <string>${{ secrets.IOS_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        # An App Store Connect API key, not an Apple ID password: it does not
        # expire every few months and it carries no two-factor prompt.
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_PRIVATE_KEY" | base64 -d \
            > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
