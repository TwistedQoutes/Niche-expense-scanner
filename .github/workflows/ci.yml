name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A force-push or a quick follow-up commit shouldn't leave the previous run
# burning minutes on code nobody is going to look at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      # One leg failing shouldn't cancel the other and hide its result — when
      # a change breaks only one Node version, that difference is the finding.
      fail-fast: false
      matrix:
        # 22 is the floor declared in package.json `engines` (vitest needs
        # >=22.12); 24 is the current LTS. Both gate: the project claims to
        # support this range, so a failure on either is a real failure.
        node: ['22', '24']

    # A real Postgres, not a stand-in: the migrations are applied against it
    # below, so a migration that does not apply cleanly fails here rather than
    # during a production deploy.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Placeholders, NOT secrets — and deliberately obvious about it.
      #
      # The app validates its whole environment at boot (src/lib/env.ts), so
      # `prisma generate` (via postinstall) and `next build` both refuse to run
      # without these. Nothing here reaches a real service: every integration
      # (Stripe, Twilio, Resend, OpenAI) is independently optional and stays off
      # while its key is unset, which is what makes this honest rather than a
      # place credentials would eventually be needed.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobflow_ci
      AUTH_SECRET: ci-placeholder-value-not-a-real-credential
      # Keeps `next build` from reporting anonymous usage data from CI.
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # Caches ~/.npm, keyed on the lockfile.
          cache: npm
          cache-dependency-path: package-lock.json

      # Next's own CI guidance (node_modules/next/dist/docs/01-app/02-guides/
      # ci-build-caching.md). Keyed on the lockfile plus sources, with a
      # lockfile-only fallback so a source-only change still restores a cache.
      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: >-
            ${{ runner.os }}-node${{ matrix.node }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node }}-next-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node${{ matrix.node }}-next-

      - name: Install dependencies
        # `npm ci` installs exactly the lockfile and fails if it has drifted
        # from package.json — which is what CI should want.
        run: npm ci

      - name: Apply migrations
        # Proves every committed migration applies to an empty database in
        # order — the thing that otherwise only gets tested in production.
        run: npx prisma migrate deploy

      # Runs against the database the migrations were just applied to. Asserts
      # every relation between two tenant-owned tables is still a composite
      # foreign key, that each ON DELETE SET NULL still names only its own
      # column, and — by attempting one inside a transaction it rolls back — that
      # Postgres still refuses a cross-tenant reference. A `prisma migrate dev`
      # that regenerates one of these constraints drops the column list and
      # breaks deletes without failing anything else in the toolchain.
      - name: Check the tenant boundary is still enforced
        run: npm run db:check-constraints

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Advisory, not gating: an advisory published upstream overnight should be
      # visible in the run summary without blocking an unrelated pull request.
      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest

    # These drive a real browser against a real build and a real database, which
    # is the only place the properties they check are observable: multi-tenant
    # isolation is a claim about what one signed-in session can reach, and no
    # unit test can see that. Split by Playwright project so a desktop-only or
    # phone-only regression names itself in the run list.
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobflow_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobflow_e2e
      AUTH_SECRET: ci-placeholder-value-not-a-real-credential
      APP_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
      # No outbound message can leave a CI run. The specs create customers with
      # phone numbers, and the review and quote flows are built to text people.
      SMS_DRIVER: none
      EMAIL_DRIVER: none

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browser
        # Chromium only — both projects use it, and the browser download is the
        # slowest step in this job.
        run: npx playwright install --with-deps chromium

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      # `playwright.config.ts` starts `next start` itself and waits for it, so
      # there is no server to launch or poll here. A fresh process also means a
      # fresh rate limiter: signup is capped per IP and the whole suite arrives
      # from one address, which is a real failure mode when the same server has
      # been serving runs all day.
      - name: Run the end-to-end suite
        run: npm run test:e2e -- --project=${{ matrix.project }}

      - name: Upload the report when something failed
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
