name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A force-push or a quick follow-up commit shouldn't leave the previous run
# burning minutes on code nobody is going to look at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      # One leg failing shouldn't cancel the other and hide its result — when
      # a change breaks only one Node version, that difference is the finding.
      fail-fast: false
      matrix:
        # 22 is the floor declared in package.json `engines` (vitest needs
        # >=22.12); 24 is the current LTS. Both gate: the project claims to
        # support this range, so a failure on either is a real failure.
        node: ['22', '24']

    # A real Postgres, not a stand-in: the migrations are applied against it
    # below, so a migration that does not apply cleanly fails here rather than
    # during a production deploy.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nes_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Placeholders, NOT secrets — and deliberately obvious about it.
      #
      # The app validates its whole environment at boot (src/lib/env.ts), so
      # `prisma generate` (via postinstall) and `next build` both refuse to run
      # without these.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nes_ci
      AUTH_SECRET: ci-placeholder-value-not-a-real-credential
      # Keeps `next build` from reporting anonymous usage data from CI.
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # Caches ~/.npm, keyed on the lockfile.
          cache: npm

      # Next's own CI guidance (node_modules/next/dist/docs/01-app/02-guides/
      # ci-build-caching.md). Keyed on the lockfile plus sources, with a
      # lockfile-only fallback so a source-only change still restores a cache.
      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: >-
            ${{ runner.os }}-node${{ matrix.node }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node }}-next-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node${{ matrix.node }}-next-

      - name: Install dependencies
        # `npm ci` installs exactly the lockfile and fails if it has drifted
        # from package.json — which is what CI should want.
        run: npm ci

      - name: Apply migrations
        # Proves every committed migration applies to an empty database in
        # order — the thing that otherwise only gets tested in production.
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # Also exercises scripts/setup-ocr-assets.mjs, so a broken OCR asset
        # path is caught here rather than by an artist mid-scan.
        run: npm run build

      # Advisory, not gating: an advisory published upstream overnight should be
      # visible in the run summary without blocking an unrelated pull request.
      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
