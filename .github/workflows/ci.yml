name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A force-push or a quick follow-up commit shouldn't leave the previous run
# burning minutes on code nobody is going to look at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      # One leg failing shouldn't cancel the other and hide its result.
      fail-fast: false
      matrix:
        include:
          # The version this project is developed and verified against, and the
          # floor declared in package.json `engines` (vitest needs >=22.12).
          - node: '22'
            required: true
          # Next LTS. Reported but not gating — a break here is worth knowing
          # about without failing an otherwise fine pull request.
          - node: '24'
            required: false

    continue-on-error: ${{ !matrix.required }}

    env:
      # Placeholders, NOT secrets — and deliberately obvious about it.
      #
      # The app validates its whole environment at boot (src/lib/env.ts), so
      # both `prisma generate` (via postinstall) and `next build` refuse to run
      # without these. Neither reaches a real database: the build only needs the
      # URL to be well-formed, and no test opens a connection.
      DATABASE_URL: file:./prisma/ci.db
      AUTH_SECRET: ci-placeholder-value-not-a-real-credential
      # Keeps `next build` from reporting anonymous usage data from CI.
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # Caches ~/.npm, keyed on the lockfile.
          cache: npm

      # Next's own CI guidance (node_modules/next/dist/docs/01-app/02-guides/
      # ci-build-caching.md). Keyed on the lockfile plus sources, with a
      # lockfile-only fallback so a source-only change still restores a cache.
      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: >-
            ${{ runner.os }}-node${{ matrix.node }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node }}-next-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node${{ matrix.node }}-next-

      - name: Install dependencies
        # `npm ci` installs exactly the lockfile and fails if it has drifted
        # from package.json — which is what CI should want.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # Also exercises scripts/setup-ocr-assets.mjs, so a broken OCR asset
        # path is caught here rather than by an artist mid-scan.
        run: npm run build

      # Advisory, not gating: an advisory published upstream overnight should be
      # visible in the run summary without blocking an unrelated pull request.
      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
