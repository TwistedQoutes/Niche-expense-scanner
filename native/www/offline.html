<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JobFlow — today</title>
<style>
  /*
    The offline screen.

    This is not an error page. The crews using JobFlow lose signal in basements,
    behind buildings and halfway up a rural road, and the thing they need in
    that moment is the list of where they are going next — which was written to
    native storage by the web app while it still had a connection.

    Everything here is inline and local: no fonts, no scripts, no images from
    the network, because by definition there is no network.
  */
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --ink: #0f172a;
    --ink-soft: #475569;
    --ink-faint: #94a3b8;
    --rule: #e2e8f0;
    --accent: #059669;
    --accent-soft: #ecfdf5;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220; --card: #141f33; --ink: #e8eef7; --ink-soft: #9fb0c6;
      --ink-faint: #64748b; --rule: #24334d; --accent: #34d399; --accent-soft: #0d2a22;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 34rem; margin: 0 auto; padding: 20px 16px 40px; }

  .banner {
    display: flex; align-items: center; gap: 10px;
    background: var(--accent-soft); border: 1px solid var(--rule);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 18px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-faint); flex: none; }
  .banner p { margin: 0; font-size: .9rem; color: var(--ink-soft); }
  .banner strong { color: var(--ink); }

  h1 { font-size: 1.45rem; margin: 0 0 2px; letter-spacing: -.02em; }
  .sub { margin: 0 0 20px; color: var(--ink-faint); font-size: .88rem; }

  .job {
    background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .job-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .time { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent); font-size: .95rem; white-space: nowrap; }
  .who { font-weight: 600; margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .what { margin: 3px 0 0; color: var(--ink-soft); font-size: .9rem; }
  .addr { margin: 7px 0 0; color: var(--ink-faint); font-size: .85rem; overflow-wrap: anywhere; }

  .empty { text-align: center; padding: 36px 16px; color: var(--ink-faint); }
  .empty p { margin: 0 0 6px; }

  button {
    width: 100%; margin-top: 18px; padding: 13px;
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  button:active { opacity: .85; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .stamp { margin-top: 14px; text-align: center; font-size: .78rem; color: var(--ink-faint); }
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">
    <span class="dot" id="dot"></span>
    <p><strong>No connection.</strong> Showing the last schedule saved to this phone.</p>
  </div>

  <h1 id="heading">Today</h1>
  <p class="sub" id="savedAt">Looking for a saved copy&hellip;</p>

  <div id="jobs"></div>

  <button id="retry" type="button">Try again</button>
  <p class="stamp">New jobs and changes appear once you are back on a signal.</p>
</div>

<script>
(function () {
  'use strict';

  var jobsEl = document.getElementById('jobs');
  var savedAtEl = document.getElementById('savedAt');
  var retryEl = document.getElementById('retry');
  var dotEl = document.getElementById('dot');

  // Everything that reaches the DOM goes through here. The cached payload came
  // from our own server, but it carries customer names and addresses typed by
  // members of the public, and this page builds markup by hand.
  function text(parent, tag, className, value) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    node.textContent = value == null ? '' : String(value);
    parent.appendChild(node);
    return node;
  }

  function renderEmpty(message, detail) {
    jobsEl.textContent = '';
    var box = document.createElement('div');
    box.className = 'empty';
    text(box, 'p', null, message);
    if (detail) text(box, 'p', null, detail);
    jobsEl.appendChild(box);
  }

  function renderJobs(payload) {
    var jobs = (payload && Array.isArray(payload.jobs)) ? payload.jobs : [];

    if (payload && payload.savedAt) {
      var when = new Date(payload.savedAt);
      savedAtEl.textContent = isNaN(when.getTime())
        ? 'Saved copy'
        : 'Saved ' + when.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
    } else {
      savedAtEl.textContent = '';
    }

    if (payload && payload.heading) {
      document.getElementById('heading').textContent = payload.heading;
    }

    if (jobs.length === 0) {
      renderEmpty('Nothing saved yet.', 'Open JobFlow once with a signal and your day will be here next time.');
      return;
    }

    jobsEl.textContent = '';
    jobs.forEach(function (job) {
      var card = document.createElement('div');
      card.className = 'job';

      var top = document.createElement('div');
      top.className = 'job-top';
      text(top, 'p', 'who', job.customer || 'Job');
      text(top, 'span', 'time', job.time || '');
      card.appendChild(top);

      if (job.service) text(card, 'p', 'what', job.service);
      if (job.address) text(card, 'p', 'addr', job.address);

      jobsEl.appendChild(card);
    });
  }

  // Native storage, shared with the web app running at the server origin.
  // localStorage could not do this job: the local page and the remote app are
  // different origins, so they would not see each other's keys.
  function readCache() {
    var bridge = window.Capacitor && window.Capacitor.Plugins;
    if (!bridge || !bridge.Preferences) {
      renderEmpty('Offline.', 'Reconnect to see your schedule.');
      savedAtEl.textContent = '';
      return;
    }

    bridge.Preferences.get({ key: 'jobflow.schedule.today' })
      .then(function (result) {
        if (!result || !result.value) {
          renderEmpty('Nothing saved yet.', 'Open JobFlow once with a signal and your day will be here next time.');
          savedAtEl.textContent = '';
          return;
        }
        var parsed;
        try {
          parsed = JSON.parse(result.value);
        } catch (error) {
          renderEmpty('The saved copy could not be read.', 'It will be rewritten next time you are online.');
          savedAtEl.textContent = '';
          return;
        }
        renderJobs(parsed);
      })
      .catch(function () {
        renderEmpty('Offline.', 'Reconnect to see your schedule.');
        savedAtEl.textContent = '';
      });
  }

  retryEl.addEventListener('click', function () {
    retryEl.disabled = true;
    retryEl.textContent = 'Reconnecting…';

    var network = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Network;
    var check = network ? network.getStatus() : Promise.resolve({ connected: navigator.onLine });

    check.then(function (status) {
      if (status && status.connected) {
        // Back to the real app. Capacitor restores the server URL on reload.
        window.location.reload();
        return;
      }
      retryEl.disabled = false;
      retryEl.textContent = 'Still offline — try again';
    }).catch(function () {
      retryEl.disabled = false;
      retryEl.textContent = 'Try again';
    });
  });

  // Reconnecting on its own is better than making someone tap a button they
  // cannot see from the driver's seat.
  var network = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Network;
  if (network && network.addListener) {
    network.addListener('networkStatusChange', function (status) {
      if (status && status.connected) {
        dotEl.style.background = 'var(--accent)';
        window.setTimeout(function () { window.location.reload(); }, 400);
      }
    });
  }

  readCache();
})();
</script>
</body>
</html>
